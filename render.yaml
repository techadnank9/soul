# The API and the job runner on Render, as decision 192 said they would be.
#
# One image, two services. The web service answers the app and the worker
# drains the queue, and both read the same environment. Every secret is
# sync: false, which means Render asks for it in the dashboard on first deploy
# and never reads it from this file. Nothing secret is in this repository.
#
# Not the free plan for the web service. Render spins a free instance down
# after fifteen minutes and takes about a minute to wake, and beat one is
# built around three seconds.
services:
  - type: web
    name: soul-api
    runtime: docker
    plan: starter
    region: oregon
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: APPLE_BUNDLE_ID
        value: com.soulspacehealth.soul
      - key: OPENAI_API_KEY
        sync: false
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: SENTRY_DSN
        value: https://a2473c98efd8c05fbb8570017b1a669b@o4512024433393664.ingest.us.sentry.io/4512024454430720
      - key: SOUL_JOBS_SECRET
        generateValue: true
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM
        sync: false
      # App review signs in with this address and this code, because a
      # reviewer cannot receive a code sent to an inbox they do not own and
      # first run cannot be skipped. Off unless both are set. Unset them when
      # the review is over. Decision 261.
      - key: SOUL_REVIEW_EMAIL
        sync: false
      - key: SOUL_REVIEW_CODE
        sync: false

  - type: worker
    name: soul-worker
    runtime: docker
    plan: starter
    region: oregon
    dockerCommand: npm run worker -w @soul/api
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: APPLE_BUNDLE_ID
        value: com.soulspacehealth.soul
      - key: OPENAI_API_KEY
        sync: false
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: SENTRY_DSN
        value: https://a2473c98efd8c05fbb8570017b1a669b@o4512024433393664.ingest.us.sentry.io/4512024454430720
