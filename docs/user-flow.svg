<svg xmlns="http://www.w3.org/2000/svg" width="680" height="530" viewBox="0 0 680 530" role="img">
<title>Soul user flow across three time horizons</title>
<desc>The two minute moment, the same session if they stay, and what happens days and months later.</desc>
<style>
text{font-family:-apple-system,'Segoe UI',Roboto,sans-serif}
.th{font-size:14px;font-weight:500}
.ts{font-size:12px}
.lb{font-size:13px;font-weight:500;fill:#4A4842}
.arr{stroke:#8A8780;stroke-width:1.2;fill:none}
.purple rect{fill:#F0EFFB;stroke:#7F77DD;stroke-width:0.5}
.purple .th,.purple .ts{fill:#3F3A8C}
.teal rect{fill:#E4F2ED;stroke:#1D9E75;stroke-width:0.5}
.teal .th,.teal .ts{fill:#12664B}
.coral rect{fill:#FAECE7;stroke:#D85A30;stroke-width:0.5}
.coral .th,.coral .ts{fill:#993C1D}
.red rect{fill:#FBE9E7;stroke:#D14026;stroke-width:0.5}
.red .th,.red .ts{fill:#8F2E1B}
.green rect{fill:#EAF3DE;stroke:#639922;stroke-width:0.5}
.green .th,.green .ts{fill:#3B6D11}
.band{fill:none;stroke:#C9C6BF;stroke-width:0.5;stroke-dasharray:5 4}
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#8A8780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>

<rect x="0" y="0" width="680" height="530" fill="#FDFCFA"/>

<rect class="band" x="40" y="30" width="600" height="140" rx="20"/>
<text class="lb" x="64" y="52" dominant-baseline="central">The moment, about two minutes</text>

<g class="purple"><rect x="60" y="80" width="125" height="64" rx="12"/><text class="th" x="122" y="103" text-anchor="middle" dominant-baseline="central">You speak</text><text class="ts" x="122" y="125" text-anchor="middle" dominant-baseline="central">voice or type</text></g>
<line x1="187" y1="112" x2="201" y2="112" class="arr" marker-end="url(#arrow)"/>
<g class="teal"><rect x="205" y="80" width="125" height="64" rx="12"/><text class="th" x="267" y="103" text-anchor="middle" dominant-baseline="central">Confirm</text><text class="ts" x="267" y="125" text-anchor="middle" dominant-baseline="central">send or discard</text></g>
<line x1="332" y1="112" x2="346" y2="112" class="arr" marker-end="url(#arrow)"/>
<g class="red"><rect x="350" y="80" width="125" height="64" rx="12"/><text class="th" x="412" y="103" text-anchor="middle" dominant-baseline="central">Quiet check</text><text class="ts" x="412" y="125" text-anchor="middle" dominant-baseline="central">every entry</text></g>
<line x1="477" y1="112" x2="491" y2="112" class="arr" marker-end="url(#arrow)"/>
<g class="teal"><rect x="495" y="80" width="125" height="64" rx="12"/><text class="th" x="557" y="103" text-anchor="middle" dominant-baseline="central">One line back</text><text class="ts" x="557" y="125" text-anchor="middle" dominant-baseline="central">in three seconds</text></g>

<path d="M557 144 V180 H122 V236" class="arr" marker-end="url(#arrow)"/>

<rect class="band" x="40" y="190" width="600" height="140" rx="20"/>
<text class="lb" x="64" y="212" dominant-baseline="central">If they stay, same session</text>

<g class="teal"><rect x="60" y="240" width="170" height="64" rx="12"/><text class="th" x="145" y="263" text-anchor="middle" dominant-baseline="central">The Mirror</text><text class="ts" x="145" y="285" text-anchor="middle" dominant-baseline="central">tension and a question</text></g>
<line x1="232" y1="272" x2="261" y2="272" class="arr" marker-end="url(#arrow)"/>
<g class="coral"><rect x="265" y="240" width="170" height="64" rx="12"/><text class="th" x="350" y="263" text-anchor="middle" dominant-baseline="central">Name the choice</text><text class="ts" x="350" y="285" text-anchor="middle" dominant-baseline="central">what you might do next</text></g>
<line x1="437" y1="272" x2="466" y2="272" class="arr" marker-end="url(#arrow)"/>
<g class="coral"><rect x="470" y="240" width="170" height="64" rx="12"/><text class="th" x="555" y="263" text-anchor="middle" dominant-baseline="central">It holds it</text><text class="ts" x="555" y="285" text-anchor="middle" dominant-baseline="central">until the day you said</text></g>

<path d="M555 304 V340 H145 V396" class="arr" marker-end="url(#arrow)"/>

<rect class="band" x="40" y="350" width="600" height="140" rx="20"/>
<text class="lb" x="64" y="372" dominant-baseline="central">Days and months later</text>

<g class="coral"><rect x="60" y="400" width="170" height="64" rx="12"/><text class="th" x="145" y="423" text-anchor="middle" dominant-baseline="central">How did it go?</text><text class="ts" x="145" y="445" text-anchor="middle" dominant-baseline="central">the loop closes</text></g>
<line x1="232" y1="432" x2="261" y2="432" class="arr" marker-end="url(#arrow)"/>
<g class="coral"><rect x="265" y="400" width="170" height="64" rx="12"/><text class="th" x="350" y="423" text-anchor="middle" dominant-baseline="central">A repeat appears</text><text class="ts" x="350" y="445" text-anchor="middle" dominant-baseline="central">it asks, you decide</text></g>
<line x1="437" y1="432" x2="466" y2="432" class="arr" marker-end="url(#arrow)"/>
<g class="green"><rect x="470" y="400" width="170" height="64" rx="12"/><text class="th" x="555" y="423" text-anchor="middle" dominant-baseline="central">A pattern forms</text><text class="ts" x="555" y="445" text-anchor="middle" dominant-baseline="central">only if you confirm it</text></g>
</svg>
