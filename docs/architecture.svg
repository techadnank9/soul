<svg xmlns="http://www.w3.org/2000/svg" width="680" height="597" viewBox="0 0 680 597" role="img">
<title>Soul technical architecture</title>
<desc>Flutter app over a TypeScript API, splitting into a synchronous request path and background workers, backed by Postgres and a model gateway with OpenAI primary, Gemini second and OpenRouter as fallback.</desc>
<style>
text{font-family:-apple-system,'Segoe UI',Roboto,sans-serif}
.th{font-size:14px;font-weight:500}
.ts{font-size:12px}
.arr{stroke:#8A8780;stroke-width:1.2;fill:none}
.purple rect{fill:#F0EFFB;stroke:#7F77DD;stroke-width:0.5}
.purple .th,.purple .ts{fill:#3F3A8C}
.teal rect{fill:#E4F2ED;stroke:#1D9E75;stroke-width:0.5}
.teal .th,.teal .ts{fill:#12664B}
.coral rect{fill:#FAECE7;stroke:#D85A30;stroke-width:0.5}
.coral .th,.coral .ts{fill:#993C1D}
.red rect{fill:#FBE9E7;stroke:#D14026;stroke-width:0.5}
.red .th,.red .ts{fill:#8F2E1B}
.gray rect{fill:#F4F3F0;stroke:#C9C6BF;stroke-width:0.5}
.gray .th,.gray .ts{fill:#4A4842}
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#8A8780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>

<rect x="0" y="0" width="680" height="597" fill="#FDFCFA"/>

<g class="purple"><rect x="40" y="30" width="600" height="56" rx="12"/><text class="th" x="340" y="50" text-anchor="middle" dominant-baseline="central">Flutter app</text><text class="ts" x="340" y="70" text-anchor="middle" dominant-baseline="central">iOS and Android, record, confirm transcript, offline queue</text></g>

<line x1="340" y1="88" x2="340" y2="104" class="arr" marker-end="url(#arrow)"/>

<g class="purple"><rect x="40" y="108" width="600" height="52" rx="12"/><text class="th" x="340" y="126" text-anchor="middle" dominant-baseline="central">API, auth and tenancy</text><text class="ts" x="340" y="146" text-anchor="middle" dominant-baseline="central">TypeScript, every request scoped to one student</text></g>

<line x1="230" y1="162" x2="230" y2="178" class="arr" marker-end="url(#arrow)"/>
<path d="M450 162 V170 H540 V178" class="arr" marker-end="url(#arrow)"/>

<g class="gray"><rect x="40" y="182" width="380" height="225" rx="16" stroke-dasharray="5 4"/><text class="th" x="60" y="204" dominant-baseline="central">Request path, student is waiting</text></g>

<g class="red"><rect x="60" y="220" width="340" height="38" rx="10"/><text class="th" x="230" y="239" text-anchor="middle" dominant-baseline="central">Consent gate</text></g>
<g class="teal"><rect x="60" y="268" width="340" height="38" rx="10"/><text class="th" x="230" y="287" text-anchor="middle" dominant-baseline="central">Transcription</text></g>
<g class="red"><rect x="60" y="316" width="340" height="38" rx="10"/><text class="th" x="230" y="335" text-anchor="middle" dominant-baseline="central">Safety classifier</text></g>
<g class="teal"><rect x="60" y="364" width="340" height="38" rx="10"/><text class="th" x="230" y="383" text-anchor="middle" dominant-baseline="central">Context builder, then two beats</text></g>

<g class="gray"><rect x="440" y="182" width="200" height="225" rx="16" stroke-dasharray="5 4"/><text class="th" x="460" y="204" dominant-baseline="central">Workers</text></g>

<g class="coral"><rect x="460" y="220" width="160" height="38" rx="10"/><text class="th" x="540" y="239" text-anchor="middle" dominant-baseline="central">Tagger</text></g>
<g class="coral"><rect x="460" y="280" width="160" height="38" rx="10"/><text class="th" x="540" y="299" text-anchor="middle" dominant-baseline="central">Pattern finder</text></g>
<g class="coral"><rect x="460" y="340" width="160" height="38" rx="10"/><text class="th" x="540" y="359" text-anchor="middle" dominant-baseline="central">Check backs</text></g>

<line x1="150" y1="407" x2="150" y2="433" class="arr" marker-end="url(#arrow)"/>
<path d="M300 407 V421 H450 V433" class="arr" marker-end="url(#arrow)"/>
<line x1="540" y1="407" x2="540" y2="433" class="arr" marker-end="url(#arrow)"/>

<g class="purple"><rect x="40" y="437" width="290" height="76" rx="12"/><text class="th" x="185" y="464" text-anchor="middle" dominant-baseline="central">Postgres</text><text class="ts" x="185" y="488" text-anchor="middle" dominant-baseline="central">pgvector, row level security, jobs</text></g>

<g class="gray"><rect x="350" y="437" width="290" height="140" rx="12"/><text class="th" x="370" y="457" dominant-baseline="central">Model gateway</text></g>
<g class="teal"><rect x="370" y="471" width="250" height="30" rx="8"/><text class="th" x="495" y="486" text-anchor="middle" dominant-baseline="central">1. OpenAI, primary</text></g>
<g class="purple"><rect x="370" y="505" width="250" height="30" rx="8"/><text class="th" x="495" y="520" text-anchor="middle" dominant-baseline="central">2. Gemini, second</text></g>
<g class="coral"><rect x="370" y="539" width="250" height="30" rx="8"/><text class="th" x="495" y="554" text-anchor="middle" dominant-baseline="central">3. OpenRouter, fallback</text></g>
</svg>
